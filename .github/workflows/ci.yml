name: Research scaffold CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'streamlit>=1.40,<2' 'auditkit==1.1.3'
      - name: Environment preflight (informational, no GPU required)
        run: python -m scripts.preflight
      - name: Syntax-check optional dashboard and helper scripts
        run: python -m py_compile research_dashboard.py scripts/*.py policyproof/*.py
      - name: Generate synthetic fixtures
        run: python -m scripts.prepare
      - name: Verify original Tiny Aya baseline on exact saved 48-case split (NO GPU)
        run: >-
          python -m scripts.verify_evidence
          --baseline artifacts/real_baseline/tiny_aya_base_unseen_policy-rescored-v2.json
          --dataset data/unseen_policy_test.jsonl
          --out artifacts/verified_real_baseline.json
      - name: Replay actual saved baseline predictions through AuditKIT (NO inference)
        run: >-
          python -m scripts.auditkit_replay
          --report artifacts/real_baseline/tiny_aya_base_unseen_policy-rescored-v2.json
          --dataset data/unseen_policy_test.jsonl
          --output artifacts/auditkit_actual_baseline_replay.json
      - name: Evaluate fail-closed inference-time guard against real recorded baseline
        run: >-
          python -m scripts.inference_guard
          --baseline artifacts/real_baseline/tiny_aya_base_unseen_policy-rescored-v2.json
          --dataset data/unseen_policy_test.jsonl
          --output artifacts/guarded_development_evaluation.json
      - name: Generate paired report before evidence upload
        run: python -m scripts.paired_guard_uncertainty
      - name: Report release readiness accurately (may be NOT_READY)
        run: python -m scripts.submission_gate --output artifacts/submission_gate.json
      - name: Require all five evidence files before uploading
        run: |
          test -s artifacts/verified_real_baseline.json
          test -s artifacts/auditkit_actual_baseline_replay.json
          test -s artifacts/guarded_development_evaluation.json
          test -s artifacts/paired_guard_uncertainty.json
          test -s artifacts/submission_gate.json
      - name: Retain real baseline, AuditKIT and output-guard evidence (not model training)
        uses: actions/upload-artifact@v4
        with:
          name: policyproof-real-baseline-cpu-evidence
          path: |
            artifacts/verified_real_baseline.json
            artifacts/auditkit_actual_baseline_replay.json
            artifacts/guarded_development_evaluation.json
            artifacts/paired_guard_uncertainty.json
            artifacts/submission_gate.json
          retention-days: 30
      - name: Audit provenance, split isolation, and citations
        run: python -m scripts.audit_dataset --data-dir data --output artifacts/dataset-audit.json
      - name: Validate reproducible public demo build (NO GPU or external tokens)
        run: python -m scripts.build_public_demo
      - name: Validate notebook syntax and safe training defaults (NO GPU)
        run: python -m scripts.validate_notebooks
      - name: Validate independent 60-case final candidate (NO inference)
        run: python -m scripts.validate_final_holdout
      - name: Confirm no human review signoff can be fabricated in CI
        run: |
          python -m scripts.verify_review_provenance
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.frozen_pair_inference import FINAL_REL, SIGNOFF_REL, verify_review_signoff
          from policyproof.core import ROOT, sha256
          original = json.loads((ROOT / SIGNOFF_REL).read_text())
          assert original["review_complete"] is False
          assert original["review_evidence"] is None
          assert not (ROOT / "reviews").exists()
          assert sha256(ROOT / FINAL_REL)
          PY
      - name: Confirm paired final evaluation remains GPU-free during CI
        run: |
          python -m scripts.frozen_pair_inference
          python -m scripts.finish_saved_pair
      - name: Verify Hugging Face release links are not self-certified (NO NETWORK)
        run: |
          python -m scripts.verify_hf_collections
          python -m scripts.verify_hf_collections --dataset-only
          python - <<'PY'
          from scripts.track2a_readiness import readiness
          result = readiness()
          assert result["checks"]["public_ungated_hf_collections"]["passed"] is False
          assert result["ready_to_submit"] is False
          PY
          python - <<'PY'
          from scripts.frozen_pair_inference import build_preflight
          report=build_preflight()
          assert report["inference_performed"] is False
          assert report["model_improvement_proven"] is False
          assert report["status"] in ("BLOCKED", "READY_FOR_EXPLICIT_GPU_EXECUTION")
          PY
      - name: Unit and regression tests
        run: python -m pytest -q
      - name: Smoke-test conservative mock evaluator (NOT MODEL QUALITY)
        run: python -m scripts.evaluate --split unseen-policy --engine mock-abstain --output artifacts/mock.json
      - name: Smoke-test perfect-format oracle (NOT MODEL QUALITY)
        run: python -m scripts.evaluate --split paraphrase --engine mock-oracle --output artifacts/mock-paraphrase.json
      - name: Training dry-run (no GPU or model access)
        run: python -m scripts.train

  torch-cpu:
    name: Training guard CPU tensors
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small CPU-only testing prerequisites
        run: python -m pip install pytest
      - name: Install official PyTorch 2.10 CPU wheel (no CUDA)
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify CPU PyTorch training guard tests
        run: python -m pytest -q tests/test_t4_precision_repair.py tests/test_recover_t4_training.py

  track2a-cpu:
    name: Real CuratorKIT then AuditKIT safety benchmark (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official two Lexsi toolkits (no GPU, no LLM calls)
        run: python -m pip install 'curatorkit==0.1.22' 'auditkit==1.1.3'
      - name: Generate and verify synthetic original benchmark
        run: python -m scripts.prepare
      - name: Actual CuratorKIT curation followed by AuditKIT evaluation of saved base-model outputs
        run: python -m scripts.track2a_chain --output-dir artifacts/track2a_safety
      - name: Verify curation and report files exist
        run: |
          test -s artifacts/track2a_safety/curator_input.jsonl
          test -s artifacts/track2a_safety/curator_output/sft_alpaca.jsonl
          test -s artifacts/track2a_safety/curator_output/manifest.json
          test -s artifacts/track2a_safety/curator_output/checksums.txt
          test -s artifacts/track2a_safety/track2a_chain_report.json
          test -s artifacts/track2a_safety/auditkit_native_receipt.json
      - name: Curate new unscored 72-case multilingual attack benchmark (NO MODEL INFERENCE)
        run: python -m scripts.generate_track2a_challenge --curate --output-dir artifacts/track2a_challenge_unscored
      - name: Require new 72-case CuratorKIT files and explicit unscored labels
        run: |
          test -s artifacts/track2a_challenge_unscored/challenge_v1.jsonl
          test -s artifacts/track2a_challenge_unscored/challenge_manifest.json
          test -s artifacts/track2a_challenge_unscored/challenge_curator_output/sft_alpaca.jsonl
          python -c "import json; x=json.load(open('artifacts/track2a_challenge_unscored/challenge_manifest.json')); assert x['cases']==72 and x['model_predictions_available'] is False and x['independent_human_review'] is False"
      - name: Check Track 2a research release status (must not claim published)
        run: |
          python -m scripts.track2a_readiness --output artifacts/track2a_safety/track2a_readiness.json
          python -c "import json; r=json.load(open('artifacts/track2a_safety/track2a_readiness.json')); assert r['status']=='RESEARCH_READY_HF_PUBLICATION_BLOCKED' and r['ready_to_submit'] is False"
      - name: Build unpublished, checksum-verified Track 2a research handoff (NO LICENSE / NO UPLOAD)
        run: |
          python -m scripts.build_track2a_release_candidate
          python -m scripts.build_track2a_release_candidate --build \
            --output artifacts/track2a_release_candidate_v2_UNPUBLISHED.zip
          python -m scripts.build_track2a_release_candidate \
            --inspect artifacts/track2a_release_candidate_v2_UNPUBLISHED.zip
          test -s artifacts/track2a_release_candidate_v2_UNPUBLISHED.zip
      - name: Verify new Track 2a publisher remains consent-gated and offline
        run: |
          digest=$(sha256sum artifacts/track2a_release_candidate_v2_UNPUBLISHED.zip | cut -d' ' -f1)
          python -m scripts.publish_track2a_candidate \
            --archive artifacts/track2a_release_candidate_v2_UNPUBLISHED.zip \
            --expected-archive-sha256 "$digest" \
            > artifacts/track2a_safety/publisher_v2_offline_preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/track2a_safety/publisher_v2_offline_preflight.json").read_text())
          assert report["status"] == "SOURCE_ZIP_VERIFIED_WAITING_OWNER_LICENSE"
          assert report["huggingface_upload_performed"] is False
          assert report["staged_for_upload"] is False
          assert report["new_gpu_inference_executed"] is False
          assert report["official_lexsi_submission_completed"] is False
          PY
      - name: Preserve actual toolkit execution evidence and curated safety benchmark
        uses: actions/upload-artifact@v4
        with:
          name: policyproof-track2a-real-curatorkit-auditkit-20261103
          path: |
            artifacts/track2a_safety/
            artifacts/track2a_challenge_unscored/
            artifacts/track2a_release_candidate_v2_UNPUBLISHED.zip
          if-no-files-found: error
          retention-days: 30

  browser-e2e:
    name: Live Chromium Streamlit navigation and guard regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU demo dependencies and Playwright browser
        run: |
          python -m pip install -r requirements-demo.txt 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Regenerate actual saved Tiny Aya/AuditKIT/guard evidence (CPU only)
        run: python -m scripts.build_public_demo
      - name: Start local public observatory
        run: |
          nohup bash scripts/start_public_demo.sh > /tmp/policyproof_streamlit.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:10000/_stcore/health; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:10000/_stcore/health
      - name: Interact with dashboard pages and forged-source rejection in Chromium
        run: python qa/browser_smoke.py
      - name: Save browser screenshots for judge QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policyproof-streamlit-chromium-browser-screenshots
          path: artifacts/browser-qa/
          if-no-files-found: warn
          retention-days: 14
      - name: Report Streamlit logs if browser check fails
        if: failure()
        run: tail -100 /tmp/policyproof_streamlit.log || true


  hf-sdk-contract:
    name: Real Hugging Face Hub SDK compatibility (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Hugging Face Hub SDK only
        run: python -m pip install 'huggingface_hub>=1.16,<2'
      - name: Check real SDK signatures and collection item schema (NO NETWORK CALLS)
        run: python -m scripts.check_hf_sdk_contract
