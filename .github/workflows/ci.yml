name: Research scaffold CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m scripts.prepare
      - run: python -m pytest -q
      - run: python -m scripts.evaluate --split unseen-policy --engine mock-abstain --output artifacts/mock.json
      - run: python -m scripts.evaluate --split paraphrase --engine mock-oracle --output artifacts/mock-paraphrase.json
      - run: python -m scripts.train
