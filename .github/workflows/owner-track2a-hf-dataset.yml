name: Owner-verified Track 2a Hugging Face dataset handoff

# MANUAL ONLY. The default is OFFLINE inspection of a preserved main CI ZIP.
# Publication requires explicit owner rights + publication confirmations,
# chosen license, public repository ID, collection mode, exact source checksum
# and HF_TOKEN stored in GitHub Actions secrets. It never creates model weights,
# model collections, human reviews or an official Lexsi submission.
on:
  workflow_dispatch:
    inputs:
      source_ci_run:
        description: 'Numeric successful main CI run ID that produced the original Track 2a ZIP'
        required: true
        type: string
      approved_archive_sha256:
        description: 'Leave BLANK to discover hash in inspect_only; REQUIRED, exact reviewed SHA256 for publication'
        required: false
        default: ''
        type: string
      mode:
        description: 'Safe default performs verification only (NO upload)'
        required: true
        default: inspect_only
        type: choice
        options:
          - inspect_only
          - preview_public_dataset
          - publish_public_dataset
          - verify_existing_publication
      license:
        description: 'Owner-selected DATASET license (does not cover gated model weights)'
        required: true
        default: undecided
        type: choice
        options:
          - undecided
          - cc-by-4.0
          - cc0-1.0
          - cc-by-sa-4.0
      hf_repo_id:
        description: 'Required only for publishing: namespace/new-dataset-repository'
        required: false
        type: string
      collection_mode:
        description: 'Only for publishing: new public collection or existing one'
        required: true
        default: create_new
        type: choice
        options:
          - create_new
          - use_existing
      collection_slug:
        description: 'Required for use_existing: namespace/public-collection-slug'
        required: false
        type: string
      confirm_rights:
        description: 'I independently reviewed the source data, model terms and legal rights'
        required: true
        type: boolean
        default: false
      confirm_publication:
        description: 'I explicitly authorize PUBLIC dataset upload to my Hugging Face account'
        required: true
        type: boolean
        default: false

concurrency:
  group: policyproof-track2a-owner-hf-publication
  cancel-in-progress: false

jobs:
  owner-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out protected default branch with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate all inputs without secrets or network mutation
        env:
          SOURCE_RUN: ${{ inputs.source_ci_run }}
          OWNER_SHA256: ${{ inputs.approved_archive_sha256 }}
          PUBLISH_MODE: ${{ inputs.mode }}
          SELECTED_LICENSE: ${{ inputs.license }}
          HF_REPO_ID: ${{ inputs.hf_repo_id }}
          COLLECTION_MODE: ${{ inputs.collection_mode }}
          COLLECTION_SLUG: ${{ inputs.collection_slug }}
          RIGHTS: ${{ inputs.confirm_rights }}
          PUBLICATION: ${{ inputs.confirm_publication }}
        run: |
          python - <<'PY'
          import os, re
          from scripts.publish_track2a_dataset import HF_REPO, LICENSES
          from scripts.verify_ci_hf_handoff import RUN
          mode = os.environ["PUBLISH_MODE"]
          license_id = os.environ["SELECTED_LICENSE"]
          rights = os.environ["RIGHTS"]
          publication = os.environ["PUBLICATION"]
          if os.environ.get("GITHUB_REF") != "refs/heads/main":
              raise SystemExit("This owner action is allowed on the protected main branch only")
          if not RUN.fullmatch(os.environ["SOURCE_RUN"]):
              raise SystemExit("Only numeric approved source CI run IDs are allowed")
          if mode not in ("inspect_only", "preview_public_dataset", "publish_public_dataset", "verify_existing_publication"):
              raise SystemExit("Unknown owner action")
          digest = os.environ["OWNER_SHA256"]
          if digest and not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("Any supplied original ZIP SHA256 must be lowercase 64-hex")
          if mode in ("preview_public_dataset", "publish_public_dataset", "verify_existing_publication") and not digest:
              raise SystemExit(
                  "PREVIEW / PUBLIC UPLOAD BLOCKED: first inspect the original "
                  "ZIP, then manually type its exact 64-character digest"
              )
          if license_id not in LICENSES | {"undecided"}:
              raise SystemExit("Invalid owner dataset license")
          if mode in ("inspect_only", "preview_public_dataset"):
              if rights == "true" or publication == "true":
                  raise SystemExit("Do not supply rights/publication approvals for offline inspection or preview")
              if mode == "preview_public_dataset":
                  if license_id not in LICENSES:
                      raise SystemExit("Preview requires an owner-chosen TENTATIVE dataset license")
                  if os.environ["HF_REPO_ID"] or os.environ["COLLECTION_SLUG"]:
                      raise SystemExit("Preview cannot carry a repository or collection destination")
                  print("OFFLINE PREVIEW: source-pin + tentative license only; no upload or rights consent")
              else:
                  print(
                      "INSPECTION_ONLY: optional SHA may be empty; calculate and "
                      "report original CI ZIP digest without any Hugging Face token"
                  )
          elif mode == "verify_existing_publication":
              from scripts.verify_hf_collections import HF_COLLECTION
              if rights == "true" or publication == "true":
                  raise SystemExit("Read-only recovery MUST NOT authorize a new publication")
              if license_id not in LICENSES:
                  raise SystemExit("Existing published dataset requires its exact declared license")
              if not HF_REPO.fullmatch(os.environ["HF_REPO_ID"]):
                  raise SystemExit("Read-only recovery needs actual owner/dataset repo ID")
              if (os.environ["COLLECTION_MODE"] != "use_existing"
                  or not HF_COLLECTION.fullmatch(os.environ["COLLECTION_SLUG"])):
                  raise SystemExit("Read-only recovery needs use_existing and exact public collection slug")
              print("READ-ONLY RECOVERY: anonymous dataset and collection verification; no HF token, upload or new collection")
          else:
              if rights != "true" or publication != "true":
                  raise SystemExit("Real publication requires BOTH independent owner approvals")
              if license_id not in LICENSES:
                  raise SystemExit("Owner must approve a non-undecided dataset license")
              if not HF_REPO.fullmatch(os.environ["HF_REPO_ID"]):
                  raise SystemExit("Owner must supply a valid namespace/new dataset repository")
              existing = os.environ["COLLECTION_MODE"] == "use_existing"
              if existing:
                  from scripts.verify_hf_collections import HF_COLLECTION
                  if not HF_COLLECTION.fullmatch(os.environ["COLLECTION_SLUG"]):
                      raise SystemExit("Expected namespace/public-collection-slug")
              elif os.environ["COLLECTION_MODE"] != "create_new" or os.environ["COLLECTION_SLUG"]:
                  raise SystemExit("New collection must not specify an existing collection slug")
              print("OWNER CONFIRMATIONS RECORDED: Public dataset upload remains pending all source validation")
          PY
      - name: Fetch authenticated metadata for selected original same-repository CI run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_ci_run }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" > /tmp/policyproof_original_run.json
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from scripts.verify_ci_hf_handoff import REPOSITORY, EXPECTED_WORKFLOW
          r=json.loads(Path("/tmp/policyproof_original_run.json").read_text())
          if (r.get("repository",{}).get("full_name") != REPOSITORY
              or r.get("head_repository",{}).get("full_name") != REPOSITORY
              or r.get("path") != EXPECTED_WORKFLOW
              or r.get("head_branch") != "main"
              or r.get("event") != "push"
              or r.get("conclusion") != "success"
              or r.get("status") != "completed"):
              raise SystemExit("Not a successful, same-repository main CI push")
          source=r["head_sha"]
          subprocess.run(["git","merge-base","--is-ancestor",source,"HEAD"],check=True)
          print("SOURCE_RUN_MAIN_ANCESTOR_VERIFIED:",source)
          PY
      - name: Retrieve original preserved CI archive from the EXACT specified run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_ci_run }}
          name: policyproof-track2a-real-curatorkit-auditkit-20261103
          github-token: ${{ github.token }}
          path: handoff
      - name: Verify exact owner-approved ZIP bytes and research consistency
        env:
          SOURCE_RUN: ${{ inputs.source_ci_run }}
          OWNER_SHA256: ${{ inputs.approved_archive_sha256 }}
        run: |
          set -euo pipefail
          handoff_args=(
            --metadata /tmp/policyproof_original_run.json
            --download-dir handoff
            --run-id "$SOURCE_RUN"
          )
          if [ -n "$OWNER_SHA256" ]; then
            handoff_args+=(--expected-sha256 "$OWNER_SHA256")
          fi
          mkdir -p artifacts
          python -m scripts.verify_ci_hf_handoff "${handoff_args[@]}" \
            > artifacts/owner_handoff_inspection.json
          python -m json.tool artifacts/owner_handoff_inspection.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("artifacts/owner_handoff_inspection.json").read_text())
          lines = [
              "### Track 2a original research ZIP — inspected, NOT published",
              "",
              "**Main CI run:** " + report["ci_run_id"],
              "",
              "**Original source commit:** `" + report["ci_head_sha"] + "`",
              "",
              "**Measured archive SHA256:** `" + report["measured_original_archive_sha256"] + "`",
              "",
              "Owner-approved hash supplied: **" + (
                  "YES (matched)" if report["owner_approved_archive_digest_provided"]
                  else "NO — discover-only"
              ) + "**",
              "",
              "Verified research file count: **" + str(report["files_strictly_verified"]) + "**",
              "",
              "**No publication, model inference or human review occurred.** "
              "Independently examine the exact archived files and rights "
              "before supplying this hash in a SEPARATE publish run.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY
      - name: Retain safe inspection and measured SHA256 for owner review
        if: ${{ inputs.mode == 'inspect_only' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: policyproof-track2a-inspected-source-hash
          path: artifacts/owner_handoff_inspection.json
          retention-days: 30
          if-no-files-found: error
      - name: Construct and VERIFY exact public dataset ZIP offline (NO UPLOAD)
        if: ${{ inputs.mode == 'preview_public_dataset' }}
        env:
          OWNER_SHA256: ${{ inputs.approved_archive_sha256 }}
          SELECTED_LICENSE: ${{ inputs.license }}
        run: |
          set -euo pipefail
          ORIGINAL_ZIP=handoff/track2a_release_candidate_v2_UNPUBLISHED.zip
          if [ ! -f "$ORIGINAL_ZIP" ]; then
            ORIGINAL_ZIP=handoff/artifacts/track2a_release_candidate_v2_UNPUBLISHED.zip
          fi
          python -m scripts.owner_track2a_publication_preview \
            --archive "$ORIGINAL_ZIP" --expected-sha256 "$OWNER_SHA256" \
            --license "$SELECTED_LICENSE" \
            > artifacts/owner_preview_preflight.json
          python -m scripts.owner_track2a_publication_preview \
            --archive "$ORIGINAL_ZIP" --expected-sha256 "$OWNER_SHA256" \
            --license "$SELECTED_LICENSE" \
            --inspect-zip artifacts/track2a_HF_DATASET_PUBLIC_FILES_PREVIEW_NOT_PUBLISHED.zip \
            > artifacts/owner_preview_independent_readback.json
          python - <<'PY'
          import json
          from pathlib import Path
          first=json.loads(Path("artifacts/owner_preview_preflight.json").read_text())
          second=json.loads(Path("artifacts/owner_preview_independent_readback.json").read_text())
          assert second["status"] == "OWNER_PUBLIC_FILES_PREVIEW_REBUILT_EXACTLY_NO_PUBLICATION"
          assert second["original_source_archive_sha256"] == first["original_source_archive_sha256"]
          assert second["owner_preview_archive_sha256"] == first["owner_preview_archive_sha256"]
          assert second["public_payload_file_count"] == 15
          for key in ("rights_approval_obtained_by_script",
                      "license_rights_independently_verified",
                      "huggingface_token_used", "huggingface_upload_performed",
                      "dataset_collection_created", "model_collection_created",
                      "official_lexsi_submission_completed"):
              assert second[key] is False
          PY
          {
            echo "### Owner public dataset preview — NOT PUBLISHED"
            echo ""
            echo "**Source ZIP SHA256:** \`$OWNER_SHA256\`"
            echo "**TENTATIVE license only:** \`$SELECTED_LICENSE\`"
            echo "**15 source-derived public files built & independently rechecked**"
            echo ""
            echo "Download artifact policyproof-track2a-owner-HF-PREVIEW-NOT-PUBLISHED;"
            echo "review exact README, licensing scope, hashes, original model outputs,"
            echo "synthetic challenge data and rights BEFORE a separate consented upload."
            echo "**No HF token, license approval, dataset collection, or submission.**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain owner-only offline HF public payload PREVIEW and evidence checks
        if: ${{ inputs.mode == 'preview_public_dataset' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: policyproof-track2a-owner-HF-PREVIEW-NOT-PUBLISHED
          path: |
            artifacts/track2a_HF_DATASET_PUBLIC_FILES_PREVIEW_NOT_PUBLISHED.zip
            artifacts/track2a_HF_DATASET_PUBLIC_FILES_PREVIEW_NOT_PUBLISHED.json
            artifacts/owner_preview_independent_readback.json
          retention-days: 14
          if-no-files-found: error
      - name: Install official Hugging Face API SDK (publication or read-only recovery)
        if: ${{ inputs.mode == 'publish_public_dataset' || inputs.mode == 'verify_existing_publication' }}
        run: |
          python -m pip install 'huggingface_hub>=1.16,<2'
          python -m scripts.check_hf_sdk_contract
      - name: READ-ONLY recovery of previously uploaded public dataset (NO TOKEN / NO UPLOAD)
        if: ${{ inputs.mode == 'verify_existing_publication' }}
        env:
          OWNER_SHA256: ${{ inputs.approved_archive_sha256 }}
          SELECTED_LICENSE: ${{ inputs.license }}
          HF_REPO_ID: ${{ inputs.hf_repo_id }}
          COLLECTION_SLUG: ${{ inputs.collection_slug }}
        run: |
          set -euo pipefail
          python -m scripts.verify_existing_track2a_dataset \
            --repo-id "$HF_REPO_ID" \
            --collection-slug "$COLLECTION_SLUG" \
            --expected-source-sha256 "$OWNER_SHA256" \
            --license "$SELECTED_LICENSE" \
            --output artifacts/track2a_existing_dataset_readonly_receipt.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path("artifacts/track2a_existing_dataset_readonly_receipt.json").read_text())
          assert r["status"] == "EXISTING_PUBLIC_DATASET_ANONYMOUSLY_VERIFIED_ONLY_NOT_SUBMITTED"
          assert r["all_content_sha256_verified"] is True
          assert r["huggingface_token_used"] is False
          assert r["huggingface_write_performed"] is False
          assert r["public_model_collection_requirement_verified"] is False
          assert r["official_lexsi_submission_completed"] is False
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### EXISTING DATASET VERIFIED ANONYMOUSLY — NO NEW PUBLICATION\n\n")
              f.write("**Dataset:** " + r["public_dataset_repo"] + "\n\n")
              f.write("**Dataset collection:** " + r["public_dataset_collection"] + "\n\n")
              f.write("**Pinned remote commit:** " + r["dataset_public_commit_sha"] + "\n\n")
              f.write("**15 published source files checked against 14 hashes and the approved original CI ZIP**\n\n")
              f.write("**This action did not use HF_TOKEN, upload, create a collection, or submit to Lexsi.**\n")
          PY
      - name: Retain private owner read-only recovery receipt for already public dataset
        if: ${{ inputs.mode == 'verify_existing_publication' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: policyproof-track2a-public-dataset-READONLY-RECOVERY-NOT-SUBMITTED
          path: artifacts/track2a_existing_dataset_readonly_receipt.json
          retention-days: 30
          if-no-files-found: error
      - name: PUBLIC owner-approved dataset upload and independent anonymous readback
        if: ${{ inputs.mode == 'publish_public_dataset' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OWNER_SHA256: ${{ inputs.approved_archive_sha256 }}
          SELECTED_LICENSE: ${{ inputs.license }}
          HF_REPO_ID: ${{ inputs.hf_repo_id }}
          COLLECTION_MODE: ${{ inputs.collection_mode }}
          COLLECTION_SLUG: ${{ inputs.collection_slug }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN secret is not configured; no upload attempted." >&2
            exit 2
          fi
          case "$COLLECTION_MODE" in
            create_new) collection_args=(--create-collection) ;;
            use_existing) collection_args=(--collection-slug "$COLLECTION_SLUG") ;;
            *) echo "Invalid collection mode" >&2; exit 2 ;;
          esac
          ORIGINAL_ZIP=handoff/track2a_release_candidate_v2_UNPUBLISHED.zip
          if [ ! -f "$ORIGINAL_ZIP" ]; then
            ORIGINAL_ZIP=handoff/artifacts/track2a_release_candidate_v2_UNPUBLISHED.zip
          fi
          python -m scripts.publish_track2a_candidate \
            --archive "$ORIGINAL_ZIP" \
            --expected-archive-sha256 "$OWNER_SHA256" \
            --license "$SELECTED_LICENSE" \
            --repo-id "$HF_REPO_ID" \
            --publish --confirm-rights --confirm-publication \
            "${collection_args[@]}" \
            --receipt artifacts/track2a_v2_publication_receipt.json
          echo 'PUBLIC DATASET VERIFIED. This is NOT a verified model collection or a Lexsi submission.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source/verification receipts (never credentials)
        if: ${{ inputs.mode == 'publish_public_dataset' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: policyproof-track2a-owner-publication-readback
          path: artifacts/track2a_v2_publication_receipt.json
          retention-days: 30
          if-no-files-found: error
